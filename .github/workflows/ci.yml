# Checks every push and pull request: project checks, unit and integration tests,
# the reader in Chromium and the real extension loaded in Chromium.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm test

  extension:
    name: Extension end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:extension
      - name: Build the extension package
        run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: word-crawler-extension
          path: dist/word-crawler-extension.zip
          retention-days: 14
