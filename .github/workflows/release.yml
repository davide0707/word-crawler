# Builds Word Crawler for Windows, macOS and Linux plus the browser extension.
# Runs when a GitHub release is published (tag "vX.Y.Z"), when such a tag is pushed, or by hand
# (Actions → Release → Run workflow; the packages are then only available as workflow artifacts).
# For releases, the packages and SHA256SUMS.txt are attached to the release, with the notes taken
# from the matching section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm test
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Optional code signing: when the repository secrets below exist the packages are signed
      # (and notarised on macOS); otherwise unsigned packages are built.
      #   CSC_LINK (base64 .p12/.pfx certificate), CSC_KEY_PASSWORD
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (macOS only)
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; echo "No certificate: building unsigned packages."; else echo "Certificate found: packages will be signed."; fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then EXTRA="-c.mac.notarize=true"; else unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          set +e
          npx electron-builder --publish never $EXTRA 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then echo "::error title=electron-builder ($RUNNER_OS)::$(grep -E '⨯|rror' build.log | tail -6 | tr '\n' ' ' | cut -c1-900)"; fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: word-crawler-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  extension:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: word-crawler-extension
          path: dist/word-crawler-extension.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo "- **Windows**: \`Word-Crawler-Setup-$version.exe\` (installer) or \`Word-Crawler-Portable-$version.exe\` (no installation)"
            echo "- **macOS**: \`.dmg\` — \`arm64\` for Apple silicon, \`x64\` for Intel"
            echo "- **Linux**: \`.AppImage\` or \`.deb\`"
            echo "- **Chrome, Edge, Brave**: \`word-crawler-extension.zip\` (unzip, then *Load unpacked* in \`chrome://extensions\`)"
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ github.ref_name }}
          name: Word Crawler ${{ github.ref_name }}
          body_path: notes.md
