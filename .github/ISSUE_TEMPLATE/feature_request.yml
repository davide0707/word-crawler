name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need first: what you are trying to do and why the current version makes it hard.
        *Puoi scrivere anche in italiano.*
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Browser extension
        - Analysis (summary, keywords, review)
        - Document formats or OCR
        - Disk scanner
        - Other
