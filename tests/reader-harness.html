<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Crawler · banco di prova del lettore</title>
<link rel="stylesheet" href="../core/reader.css">
</head>
<body>
<div id="app"></div>
<script src="../core/settings.js"></script>
<script src="../core/text.js"></script>
<script src="../core/analysis.js"></script>
<script src="../core/zip.js"></script>
<script src="../core/cfb.js"></script>
<script src="../core/formats.js"></script>
<script src="../core/dom.js"></script>
<script src="../core/pdfcore.js"></script>
<script src="../core/crawler.js"></script>
<script src="../core/export.js"></script>
<script src="../core/settings-ui.js"></script>
<script src="../core/results-ui.js"></script>
<script src="../core/reader.js"></script>
<script>
  // Host finto per i test: salva in memoria quello che l'app vera scriverebbe su disco
  window.__saved = [];
  window.__archive = [];
  window.reader = WCReader.mount(document.getElementById('app'), {
    saveFile: function (name, content, mime) { window.__saved.push({ name: name, content: content, mime: mime }); return Promise.resolve(true); },
    archive: { save: function (e) { window.__archive.push(e); return Promise.resolve(true); } },
    settings: { load: function () { return Promise.resolve(null); }, save: function () {} },
    fetchUrl: function (url) { return fetch(url).then(function (r) { return r.text(); }).then(function (html) { return { html: html, url: url }; }); },
    pdfjs: function () {
      return import(location.search.indexOf('pdfstub') >= 0 ? '/tests/pdfjs-stub.mjs' : '/lib/pdf.min.mjs').catch(function () { return null; });
    },
    pdfHelp: 'Per leggere i PDF serve PDF.js.'
  });
</script>
</body>
</html>
